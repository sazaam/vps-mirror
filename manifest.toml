[meta]
schema = 1
name = "vps-baseline"
captured_at = "2026-11-18T14:26:06+09:00"
source_host = "example-host"
source_os = "Ubuntu 26.04.1 LTS"


[target]
user = "example-user"
group = "users"
sudo_group = "sudo"
shell = "/usr/bin/zsh"
home = "/home/example-user"
hostname = "example-host"


[system]
timezone = "Asia/Seoul"
locale = "C.UTF-8"


[ssh]
port = "2022"
hardening_file = "ssh/sshd_hardening.conf"
authorized_keys_file = "ssh/authorized_keys"
allow_users = [
  "example-user",
]


[firewall]
enable = true
default_incoming = "deny"
allow = [
  "2022/tcp",
]


[fail2ban]
enable = true


[packages]
apt = [
  "bash",
  "bcache-tools",
  "bind9-utils",
  "btrfs-progs",
  "cloud-guest-utils",
  "cloud-init",
  "cloud-init-base",
  "cloud-initramfs-copymods",
  "cloud-initramfs-dyn-netconf",
  "curl",
  "dash",
  "diffutils",
  "eatmydata",
  "fail2ban",
  "fastfetch",
  "fdisk",
  "findutils",
  "fonts-ubuntu-console",
  "gdisk",
  "git",
  "gnupg",
  "grep",
  "grub-pc",
  "gzip",
  "hostname",
  "htop",
  "init",
  "libeatmydata1",
  "libjs-sphinxdoc",
  "libwrap0",
  "lvm2",
  "lxd-agent-loader",
  "lxd-installer",
  "mdadm",
  "mise",
  "motd-news-config",
  "nano",
  "ncurses-base",
  "ncurses-bin",
  "ncurses-term",
  "needrestart",
  "net-tools",
  "openssh-server",
  "openssh-sftp-server",
  "overlayroot",
  "patch",
  "python-babel-localedata",
  "python3-babel",
  "python3-jinja2",
  "python3-json-pointer",
  "python3-jsonpatch",
  "python3-jsonschema",
  "python3-jsonschema-specifications",
  "python3-markupsafe",
  "python3-passlib",
  "python3-referencing",
  "python3-rpds-py",
  "python3-serial",
  "qemu-guest-agent",
  "shim-signed",
  "software-properties-common",
  "sos",
  "ssh-import-id",
  "tmux",
  "ubuntu-minimal",
  "ubuntu-standard",
  "unattended-upgrades",
  "update-notifier-common",
  "util-linux",
  "vim",
  "wget",
  "xfsprogs",
  "zoxide",
  "zsh",
  "zsh-autosuggestions",
  "zsh-syntax-highlighting",
]
npm = []
pipx = []
cargo = []

[packages.mise]
tools = [
  "node@26",
]



[services]
enable = [
  "apt-daily-upgrade.timer",
  "apt-daily.timer",
  "chrony.service",
  "cron.service",
  "fail2ban.service",
  "fstrim.timer",
  "logrotate.timer",
  "rsyslog.service",
  "ssh.service",
  "sysstat.service",
  "ufw.service",
  "unattended-upgrades.service",
]


[data]
paths = []
exclude = []


[cloud]
preserve_hostname = true
manage_etc_hosts = false


[hooks]
pre_apply = "hooks/pre-apply.sh"
post_apply = "hooks/post-apply.sh"


[dotfiles]
"~/.zshrc" = "dotfiles/.zshrc"
"~/.p10k.zsh" = "dotfiles/.p10k.zsh"
"~/.profile" = "dotfiles/.profile"
"~/.bashrc" = "dotfiles/.bashrc"
"~/.config/mise/config.toml" = "dotfiles/.config/mise/config.toml"
"~/.config/opencode/cli.json" = "dotfiles/.config/opencode/cli.json"
"~/.config/opencode/tui.jsonc" = "dotfiles/.config/opencode/tui.jsonc"
"~/.config/herdr/config.toml" = "dotfiles/.config/herdr/config.toml"
"~/.config/herdr/.plugins.lock" = "dotfiles/.config/herdr/.plugins.lock"
"~/.ssh/config" = "dotfiles/.ssh/config"


[system_files]
"/etc/fail2ban/jail.local" = "system/etc/fail2ban/jail.local"


[[repos]]
path = "~/.config/dots"
url = "git@github.com:OWNER/REPO.git"
branch = "main"


[[repos]]
path = "~/.oh-my-zsh"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
branch = "master"


[[repos]]
path = "~/.oh-my-zsh/custom/themes/powerlevel10k"
url = "https://github.com/romkatv/powerlevel10k.git"
branch = "master"


[[binaries]]
name = "herdr"
path = "~/.local/bin/herdr"
size_mb = 25.0
install = ""


[[binaries]]
name = "herdr-core"
path = "~/.local/bin/herdr-core"
size_mb = 7.3
install = ""


[[binaries]]
name = "opencode"
path = "~/.opencode/bin/opencode"
size_mb = 191.6
install = ""


[[binaries]]
name = "opencode2"
path = "~/.opencode/bin/opencode2"
size_mb = 0.0
install = ""
